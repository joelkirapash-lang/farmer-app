
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmerPro - Market Insights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🚜 FarmerPro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto"> <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Check Market Prices</h5>
                        <div class="input-group mb-3">
                            <input type="text" id="cropSearch" class="form-control" placeholder="Enter crop name (e.g., Maize)...">
                            <button class="btn btn-success" id="searchBtn">Search</button>
                        </div>
                    </div>
                </div>

                <div id="resultContainer" class="d-none mb-5">
                    <div class="card border-success shadow">
                        <div class="card-header bg-success text-white">Market Results</div>
                        <div class="card-body" id="displayArea"></div>
                    </div>
                </div>

                <div class="text-center my-5">
                    <h2 class="mb-4 text-success">Our Sustainable Future</h2>
                    <img src="https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=1000" 
                         alt="Green Crops" 
                         class="img-fluid rounded shadow-lg" 
                         style="max-height: 400px; width: 100%; object-fit: cover;">
                </div>

            </div>
        </div>
    </div>

    <footer class="bg-dark text-white pt-4 pb-2 mt-auto">
        <div class="container text-center">
            <p class="mb-1">© 2026 FarmerPro Insights. Empowering agriculture through data.</p>
            <small class="text-secondary">Privacy Policy | Terms of Service</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
